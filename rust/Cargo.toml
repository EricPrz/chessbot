[package]
name = "chess-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
flexi_logger = "0.31.10"
log = {
  version = "0.4.33",
  features = [
    "release_max_level_warn"
  ]
}
nnue-rs = "0.4.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking"] }

[lib]
path = "src/lib/mod.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
